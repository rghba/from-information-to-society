<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 510" fill="none" role="img" aria-labelledby="title desc"><title id="title">A shared journey from questions to people in dialogue</title><desc id="desc">An open book, an intersecting path with two people, and a small settlement in warm muted colors</desc>
